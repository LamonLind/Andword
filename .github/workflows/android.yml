name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ci

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      - name: Build Android 8 compatible APKs
        working-directory: apps/wordcraft-android/android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ./gradlew assembleRelease -Pwordcraft.abis=arm64-v8a --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/wordcraft-android-arm64-v8a.apk"
          ./gradlew assembleRelease -Pwordcraft.abis=armeabi-v7a --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/wordcraft-android-armeabi-v7a.apk"

      - name: Verify minimum Android API
        run: |
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          fi
          echo "Built APKs:"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: dist/*.apk
          if-no-files-found: error
