name: Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ci

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      - name: Build Android 8 compatible APKs
        working-directory: apps/wordcraft-android/android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ./gradlew lint assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/wordcraft-android-arm64-v8a-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/wordcraft-android-arm64-v8a.apk"

      - name: Verify API 26 native imports
        run: |
          unzip -q dist/wordcraft-android-arm64-v8a.apk lib/arm64-v8a/libwordcraft_android.so
          so=lib/arm64-v8a/libwordcraft_android.so
          forbidden='getentropy|aligned_alloc|statx|memfd_create|mremap|pkey_|copy_file_range'
          if readelf --dyn-syms --wide "$so" | grep -E "$forbidden"; then
            echo "::error::Native library imports an API symbol newer than API 26"
            exit 1
          fi
          rm -f "$so"
          rmdir -p lib/arm64-v8a 2>/dev/null || true

      - name: Verify manifest minimum SDK
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt"
          "$aapt" dump badging dist/wordcraft-android-arm64-v8a.apk | grep -F "sdkVersion:'26'"

      - name: Verify minimum Android API
        run: |
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          fi
          echo "Built APKs:"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: dist/*.apk
          if-no-files-found: error
