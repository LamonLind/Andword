org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Phones use arm64-v8a only.
wordcraft.abis=arm64-v8a

# The app's version and its version code (before the ABI digit: see app/build.gradle.kts, the build
# checks the two agree). Set both to the release's before tagging it: the release workflow refuses a
# tag that differs, and F-Droid's update check reads them from here.
wordcraft.version=0.0.1-beta
wordcraft.versionCode=101
